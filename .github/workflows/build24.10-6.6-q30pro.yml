#
# https://github.com/P3TERX/Actions-OpenWrt
#
# File: .github/workflows/openwrt-builder.yml
# Description: Build ImmortalWrt 24.10 JCG Q30 Pro
#

name: Build immortalwrt24.10-5.4 JCG Q30Pro Latest Passwall

on:
  repository_dispatch:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/padavanonly/immortalwrt-mt798x-24.10
  REPO_BRANCH: 2410

  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: 2410-5.4-q30pro-passwall.config
  DIY_P1_SH: diy-part10.sh
  DIY_P2_SH: diy-part2-6-1-pw.sh
  RELEASE_FILE: 2410-5.4-pw-release.txt

  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true

  UPLOAD_COWTRANSFER: false
  UPLOAD_WETRANSFER: false

  # 开启 GitHub Release
  UPLOAD_RELEASE: true

  TZ: Asia/Shanghai


# ============================================================
# GitHub Actions 权限
# ============================================================
# contents: write
#   用于创建 Release、上传固件、删除旧 Release
#
# actions: write
#   用于删除旧的 Workflow Runs
# ============================================================
permissions:
  contents: write
  actions: write


jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

    # ========================================================
    # Checkout
    # ========================================================
    - name: Checkout
      uses: actions/checkout@v4


    # ========================================================
    # Initialization environment
    # ========================================================
    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive

      run: |
        sudo rm -rf \
          /etc/apt/sources.list.d/* \
          /usr/share/dotnet \
          /usr/local/lib/android \
          /opt/ghc

        sudo -E apt-get -qq update

        sudo -E apt-get -qq install \
          $(curl -fsSL git.io/depends-ubuntu-2004)

        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean

        sudo timedatectl set-timezone "$TZ"

        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir


    # ========================================================
    # Clone source code
    # ========================================================
    - name: Clone source code
      working-directory: /workdir

      run: |
        df -hT $PWD

        git clone \
          "$REPO_URL" \
          -b "$REPO_BRANCH" \
          openwrt

        ln -sf \
          /workdir/openwrt \
          "$GITHUB_WORKSPACE/openwrt"


    # ========================================================
    # Load custom feeds
    # ========================================================
    - name: Load custom feeds

      run: |
        if [ -e "$FEEDS_CONF" ]; then
          mv "$FEEDS_CONF" openwrt/feeds.conf.default
        fi

        chmod +x "$DIY_P1_SH"

        cd openwrt

        "$GITHUB_WORKSPACE/$DIY_P1_SH"


    # ========================================================
    # Update feeds
    # ========================================================
    - name: Update feeds

      run: |
        cd openwrt

        ./scripts/feeds update -a


    # ========================================================
    # Install feeds
    # ========================================================
    - name: Install feeds

      run: |
        cd openwrt

        ./scripts/feeds install -a


    # ========================================================
    # Load custom configuration
    # ========================================================
    - name: Load custom configuration

      run: |
        if [ -e files ]; then
          mv files openwrt/files
        fi

        if [ -e "$CONFIG_FILE" ]; then
          mv "$CONFIG_FILE" openwrt/.config
        else
          echo "ERROR: $CONFIG_FILE not found!"
          exit 1
        fi

        chmod +x "$DIY_P2_SH"

        cd openwrt

        "$GITHUB_WORKSPACE/$DIY_P2_SH"


    # ========================================================
    # SSH connection to Actions
    # ========================================================
    - name: SSH connection to Actions

      uses: P3TERX/ssh2actions@v1.0.0

      if: >
        (github.event.inputs.ssh == 'true' &&
        github.event.inputs.ssh != 'false') ||
        contains(github.event.action, 'ssh')

      env:
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}


    # ========================================================
    # Download package
    # ========================================================
    - name: Download package
      id: package

      run: |
        cd openwrt

        make defconfig

        make download -j8

        find dl -size -1024c -exec ls -l {} \;

        find dl -size -1024c -exec rm -f {} \;


    # ========================================================
    # Compile firmware
    # ========================================================
    - name: Compile the firmware
      id: compile

      run: |
        cd openwrt

        echo "======================================"
        echo "CPU threads: $(nproc)"
        echo "======================================"

        make -j$(nproc) || \
        make -j1 || \
        make -j1 V=s

        echo "status=success" >> "$GITHUB_OUTPUT"

        grep '^CONFIG_TARGET.*DEVICE.*=y' .config \
          | sed -r 's/.*DEVICE_(.*)=y/\1/' \
          > DEVICE_NAME

        if [ -s DEVICE_NAME ]; then
          echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> "$GITHUB_ENV"
        fi

        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> "$GITHUB_ENV"


    # ========================================================
    # Check space usage
    # ========================================================
    - name: Check space usage

      if: (!cancelled())

      run: |
        df -hT


    # ========================================================
    # Upload bin directory
    # ========================================================
    - name: Upload bin directory

      uses: actions/upload-artifact@v4

      if: >
        steps.compile.outputs.status == 'success' &&
        env.UPLOAD_BIN_DIR == 'true'

      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin


    # ========================================================
    # Organize firmware files
    # ========================================================
    - name: Organize files
      id: organize

      if: >
        env.UPLOAD_FIRMWARE == 'true' &&
        !cancelled()

      run: |
        set -e

        echo "Searching firmware directory..."

        TARGET_DIR=$(find openwrt/bin/targets \
          -mindepth 2 \
          -maxdepth 2 \
          -type d \
          | head -n 1)

        if [ -z "$TARGET_DIR" ]; then
          echo "ERROR: Firmware target directory not found!"
          echo "Contents of openwrt/bin:"
          find openwrt/bin -maxdepth 4 -type f | head -100
          exit 1
        fi

        echo "Firmware directory:"
        echo "$TARGET_DIR"

        cd "$TARGET_DIR"

        rm -rf packages

        echo "FIRMWARE=$PWD" >> "$GITHUB_ENV"

        echo "status=success" >> "$GITHUB_OUTPUT"


    # ========================================================
    # Upload firmware artifact
    # ========================================================
    - name: Upload firmware directory

      uses: actions/upload-artifact@v4

      if: >
        steps.organize.outputs.status == 'success' &&
        !cancelled()

      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}


    # ========================================================
    # Upload firmware to Cowtransfer
    # ========================================================
    - name: Upload firmware to cowtransfer
      id: cowtransfer

      if: >
        steps.organize.outputs.status == 'success' &&
        env.UPLOAD_COWTRANSFER == 'true' &&
        !cancelled()

      run: |
        curl -fsSL git.io/file-transfer | sh

        ./transfer cow \
          --block 2621440 \
          -s \
          -p 64 \
          --no-progress \
          "${FIRMWARE}" \
          2>&1 | tee cowtransfer.log

        URL=$(grep https cowtransfer.log | head -n 1 | awk '{print $3}')

        echo "url=$URL" >> "$GITHUB_OUTPUT"


    # ========================================================
    # Upload firmware to WeTransfer
    # ========================================================
    - name: Upload firmware to WeTransfer
      id: wetransfer

      if: >
        steps.organize.outputs.status == 'success' &&
        env.UPLOAD_WETRANSFER == 'true' &&
        !cancelled()

      run: |
        curl -fsSL git.io/file-transfer | sh

        ./transfer wet \
          -s \
          -p 16 \
          --no-progress \
          "${FIRMWARE}" \
          2>&1 | tee wetransfer.log

        URL=$(grep https wetransfer.log | head -n 1 | awk '{print $3}')

        echo "url=$URL" >> "$GITHUB_OUTPUT"


    # ========================================================
    # Generate release tag
    # ========================================================
    - name: Generate release tag
      id: tag

      if: >
        env.UPLOAD_RELEASE == 'true' &&
        !cancelled()

      run: |

        RELEASE_TAG=$(date +"%Y.%m.%d-%H%M")

        echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

        touch "$RELEASE_FILE"

        if [ "$UPLOAD_COWTRANSFER" = "true" ]; then
          echo "🔗 [Cowtransfer](${{ steps.cowtransfer.outputs.url }})" \
            >> "$RELEASE_FILE"
        fi

        if [ "$UPLOAD_WETRANSFER" = "true" ]; then
          echo "🔗 [WeTransfer](${{ steps.wetransfer.outputs.url }})" \
            >> "$RELEASE_FILE"
        fi

        echo "JCG Q30 Pro ImmortalWrt 24.10" >> "$RELEASE_FILE"
        echo "Branch: 2410" >> "$RELEASE_FILE"
        echo "Kernel: 5.4" >> "$RELEASE_FILE"
        echo "Build Date: $(date)" >> "$RELEASE_FILE"

        echo "status=success" >> "$GITHUB_OUTPUT"


    # ========================================================
    # Upload firmware to GitHub Release
    # ========================================================
    - name: Upload firmware to release

      uses: softprops/action-gh-release@v2

      if: >
        steps.tag.outputs.status == 'success' &&
        !cancelled()

      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}

        name: JCG Q30 Pro ImmortalWrt 24.10 ${{ steps.tag.outputs.release_tag }}

        body_path: ${{ env.RELEASE_FILE }}

        files: |
          ${{ env.FIRMWARE }}/*


    # ========================================================
    # Delete old workflow runs
    # ========================================================
    - name: Delete workflow runs

      uses: GitRML/delete-workflow-runs@main

      with:
        retain_days: 1
        keep_minimum_runs: 3

      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


    # ========================================================
    # Remove old Releases
    # ========================================================
    - name: Remove old Releases

      uses: dev-drprasad/delete-older-releases@v0.1.0

      if: >
        env.UPLOAD_RELEASE == 'true' &&
        !cancelled()

      with:
        keep_latest: 3
        delete_tags: true

      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
